name: build

# skidcfg is a DOS program and the build that matters is Microsoft C 5.10 under
# DOSBox, which no runner has. What a runner can do is everything else, and it
# is worth doing: the same sources have to satisfy a 1988 compiler and a current
# one, and each catches things the other does not.
#
# The self-check is the reason this works. src/setup.c has no console anywhere
# in it, and src/drvblk.c opens no files, so the whole SETUP.DAT format and the
# whole driver block format can be exercised on a host with no DOS, no screen
# and no keyboard. src/drvscan.c compiles there too and finds nothing, which is
# what keeps the merging and the index allocation under a hosted compiler.
#
# Everything is run three times: against the shipped table, against it with the
# SC-55 entry switched on, and against a cut down table with entries removed. A
# derived count and a derived menu order are only interesting when the table is
# not the shape they were written against, and removing an entry is the case
# the whole design rests on being safe.
#
# Every job goes through the Makefile rather than spelling the sources out.
# They were spelled out once, and adding src/drvblk.c and src/drvscan.c to the
# three build files and not to this one turned the whole matrix red. There is
# one list now and it is in the Makefile.
on: [push, pull_request]

env:
  WARN: >-
    -std=c90 -pedantic-errors -Wall -Wextra -Wshadow -Wcast-qual
    -Wformat=2 -Wstrict-prototypes -Wmissing-prototypes -Wwrite-strings

jobs:
  # cppcheck reasons about the whole translation unit rather than one
  # expression at a time, so it reaches things -Wall cannot. GCC's analyzer
  # walks execution paths, which is where the fopen/fclose pairs in setup.c and
  # drvscan.c, and the border buffer in scrn.c, would show up if any were
  # wrong. Both are the "lint" target, so what CI checks and what a developer
  # runs before pushing are the same thing.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # test/dos/ is deliberately outside this. What lives there needs dos.h
      # and an _interrupt keyword, so a hosted compiler cannot read it at all;
      # that is why it is a directory rather than a name skipped somewhere, and
      # why the next instrument added there needs no change here. It is
      # formatted with everything else and built by hand under DOS.
      - name: cppcheck and the GCC analyzer
        run: make lint

  # Blocking, because the tree conforms. The version is pinned: clang-format's
  # options and their defaults change between majors, so an unpinned formatter
  # reformats the tree the day the runner image moves.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: make format-check CLANG_FORMAT=clang-format-22

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The program itself draws nothing off DOS: src/scrn.c's INT 10h calls
      # are behind the target test and everything else compiles to a stub. It
      # is built anyway, because that is what keeps four compilers reading the
      # part of the tree the self-check does not link.
      - name: Build (strict C90)
        run: make skidcfg CC=${{ matrix.cc }} CFLAGS="$WARN -O2"

      - name: Self-check
        run: make selfcheck CC=${{ matrix.cc }} CFLAGS="$WARN -O2"

      # With the SC-55 entry switched on, which is the build a project shipping
      # that driver makes. Seven sound drivers rather than six, so the derived
      # count and the derived menu order are exercised against a table that is
      # not the shape they were written against.
      - name: Self-check with the SC-55 entry
        run: make selfcheck-sc55 CC=${{ matrix.cc }} CFLAGS="$WARN -O2"

      # And against a table with entries taken out, which is the check that
      # removing one is safe: the indices that remain must not have moved.
      # Nothing in the sources is special cased for it, so this is what says
      # the tree is table driven rather than driven by the shipped table.
      # It runs last because it rewrites src/drvtab.h, and puts it back.
      - name: Self-check against a cut down driver table
        run: make selfcheck-min CC=${{ matrix.cc }} CFLAGS="$WARN -O2"

  # setup.c parses text somebody hand edited and writes fixed size buffers back
  # out, and drvblk.c parses text somebody put inside a binary. The interesting
  # failures in both are the ones a static pass cannot see. The self-check
  # feeds them truncated files, files with nothing usable in them, indices
  # outside the tables and a few dozen malformed blocks, all in its own
  # process, so the sanitizers watch the refusal paths as well as the good
  # ones.
  sanitize:
    runs-on: ubuntu-latest
    env:
      SAN: >-
        -std=c90 -pedantic-errors -Wall -Wextra -g -O1
        -fsanitize=address,undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4

      # The exit codes are distinctive on purpose. The self-check refuses
      # malformed input on nearly every path it has, and a refusal and a
      # sanitizer firing are both non-zero: without a number to tell them
      # apart, a step can contain a memory error and still be read as the
      # program correctly saying no.
      - name: Self-check under ASan and UBSan
        run: |
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1:exitcode=87
          export ASAN_OPTIONS=halt_on_error=1:exitcode=86
          make selfcheck CC=clang CFLAGS="$SAN"
          make selfcheck-sc55 CC=clang CFLAGS="$SAN"
          make selfcheck-min CC=clang CFLAGS="$SAN"

  # Everything above is a hosted compiler, and a hosted compiler cannot see the
  # thing this program most needs looking at. int is 32 bits on all of them and
  # 16 on both compilers this ships from, so code that is correct up there can
  # be wrong on the machine it is for: a file offset kept in an int came back
  # negative past 32767 and a block found beyond it was thrown away. That was
  # green under four compilers, two sanitizers and cppcheck.
  #
  # So the shipped compiler and the shipped target run on every push, not only
  # on a release. Same build script the release uses, same self-check binary,
  # run under DOS.
  dos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: open-watcom/setup-watcom@v1
        with:
          version: '1.9'
          target: dos

      - name: Build with Open Watcom
        shell: cmd
        run: |
          call WCLBUILD.BAT
          if errorlevel 1 exit /b 1
          if not exist SKIDCFG.EXE exit /b 1
          if not exist SKIDCHK.EXE exit /b 1

      # The same sources with a 32-bit int, which is the half of this the
      # 16-bit build cannot do. A file offset kept in an int was correct under
      # every hosted compiler and wrong at 16 bits; the reverse mistake, code
      # that assumes the narrow width, fails to compile here instead of
      # shipping.
      - name: Build 32-bit with Open Watcom
        shell: cmd
        run: |
          call WCLBUILD.BAT 386
          if errorlevel 1 exit /b 1
          if not exist SKIDCF32.EXE exit /b 1
          if not exist SKIDCK32.EXE exit /b 1

      # And the Windows console build, which is the one of the five that can
      # be run on the runner itself.
      - name: Build and run Win32
        shell: cmd
        run: |
          call WCLBUILD.BAT WIN32
          if errorlevel 1 exit /b 1
          SKIDCKW.EXE
          if errorlevel 1 exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: dos-ci
          path: |
            SKIDCHK.EXE
            SKIDCK32.EXE
          if-no-files-found: error

  # build.cmd is the other Windows path, and it needs a job because a build
  # script nothing runs is a build script with a stale file list in it.
  #
  # Its own job rather than a step in the one above, and that part is not
  # tidiness. setup-watcom exports INCLUDE, clang on Windows reads INCLUDE, and
  # a hosted clang handed a 16-bit compiler's headers stops on the first
  # typedef of size_t. The two toolchains are for different machines and do not
  # share an environment.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with build.cmd
        shell: cmd
        run: |
          call build.cmd
          if errorlevel 1 exit /b 1

  # The 16-bit binary, run as a 16-bit binary. DOSBox is on a Linux runner and
  # the self-check needs no game data, no screen and no keyboard, so what gets
  # checked is the object code the release ships rather than a hosted build of
  # the same sources.
  dos-check:
    needs: dos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dos-ci, path: dos }

      - name: Install DOSBox
        run: sudo apt-get update && sudo apt-get install -y dosbox

      - name: Run the self-check under DOS
        run: |
          set -e
          mkdir -p run out
          cp dos/SKIDCHK.EXE run/
          cat > dosbox.conf <<'EOF'
          [sdl]
          output = surface
          [autoexec]
          mount c run
          mount l out
          c:
          SKIDCHK > L:\CHK.TXT
          exit
          EOF
          SDL_VIDEODRIVER=dummy dosbox -conf dosbox.conf -exit || true
          echo "--- what the 16-bit build says about itself ---"
          cat out/CHK.TXT
          grep -q "self-check passed" out/CHK.TXT
          ! grep -q "^FAIL" out/CHK.TXT

      - name: Run the 32-bit self-check under DOS
        run: |
          set -e
          rm -rf run out && mkdir -p run out
          cp dos/SKIDCK32.EXE run/
          cat > dos32.conf <<'EOF'
          [sdl]
          output = surface
          [dosbox]
          memsize = 32
          [autoexec]
          mount c run
          mount l out
          c:
          SKIDCK32 > L:\CHK32.TXT
          exit
          EOF
          SDL_VIDEODRIVER=dummy dosbox -conf dos32.conf -exit || true
          echo "--- what the 32-bit build says about itself ---"
          cat out/CHK32.TXT
          grep -q "self-check passed" out/CHK32.TXT
          ! grep -q "^FAIL" out/CHK32.TXT
