name: release

# Builds the three shipped binaries, generates the text files and packages two
# archives. Push a tag to publish; run it by hand to rehearse without
# publishing.
#
# The binary is built with Open Watcom rather than with Microsoft C 5.10, and
# that is worth being plain about. MSC 5.10 is the compiler the sources were
# written against and MSCBUILD.BAT is still the period build, but it cannot be
# installed on a runner, so a release built with it would be a file somebody
# made on their own machine and asked everyone to trust. Watcom has an action,
# so what ships is built in the open from the tagged commit. WCLBUILD.BAT is in
# the tree and README.md names it: it is a documented path, not one only CI
# knows about. MSCBUILD.BAT and TCBUILD.BAT are the other two DOS builds and
# are checked by hand, for the same reason.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: open-watcom/setup-watcom@v1
        with:
          version: '1.9'
          target: dos

      # WCLBUILD reads WATCOM, which the action above exported.
      - name: Build
        shell: cmd
        run: |
          call WCLBUILD.BAT
          if errorlevel 1 exit /b 1
          if not exist SKIDCFG.EXE exit /b 1
          if not exist SKIDCHK.EXE exit /b 1

      # The 32-bit binary, with DOS/32A bound in. It wants a 386 and MS-DOS
      # 4.0, so it is the second download rather than the first, and it is
      # also the build that reads the sources with a 32-bit int.
      - name: Build 32-bit
        shell: cmd
        run: |
          call WCLBUILD.BAT 386
          if errorlevel 1 exit /b 1
          if not exist SKIDCF32.EXE exit /b 1
          if not exist SKIDCK32.EXE exit /b 1

      # The Windows console build. Same screen, same keys, different API; it is
      # a program rather than a compile-only target, so it ships.
      - name: Build Win32
        shell: cmd
        run: |
          call WCLBUILD.BAT WIN32
          if errorlevel 1 exit /b 1
          if not exist SKIDCFW.EXE exit /b 1
          if not exist SKIDCKW.EXE exit /b 1

      # It runs on the runner, which is the only one of the five that can be
      # checked without an emulator.
      - name: Run the Win32 self-check
        shell: cmd
        run: |
          SKIDCKW.EXE
          if errorlevel 1 exit /b 1

      - name: Report
        shell: bash
        run: |
          ls -l SKIDCFG.EXE SKIDCHK.EXE SKIDCF32.EXE SKIDCK32.EXE SKIDCFW.EXE
          sha256sum SKIDCFG.EXE SKIDCHK.EXE SKIDCF32.EXE SKIDCK32.EXE SKIDCFW.EXE

      - uses: actions/upload-artifact@v4
        with:
          name: dos
          path: |
            SKIDCFG.EXE
            SKIDCHK.EXE
            SKIDCF32.EXE
            SKIDCK32.EXE
            SKIDCFW.EXE
          if-no-files-found: error

  # The shipped binary's own self-check, run against the shipped binary.
  #
  # skidpack cannot do this for its DOS target and says so; skidcfg can, because
  # the self-check needs no game data, no screen and no keyboard, and DOSBox
  # runs on a Linux runner. So the thing that gets published is the thing that
  # was tested, rather than a hosted build of the same sources.
  check:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dos, path: dos }

      - name: Install DOSBox
        run: sudo apt-get update && sudo apt-get install -y dosbox

      - name: Run the self-check under DOS
        run: |
          set -e
          mkdir -p run out
          cp dos/SKIDCHK.EXE run/
          cat > dosbox.conf <<'EOF'
          [sdl]
          output = surface
          [autoexec]
          mount c run
          mount l out
          c:
          SKIDCHK > L:\CHK.TXT
          exit
          EOF
          SDL_VIDEODRIVER=dummy dosbox -conf dosbox.conf -exit || true
          echo "--- what the shipped binary says about itself ---"
          cat out/CHK.TXT
          grep -q "self-check passed" out/CHK.TXT
          ! grep -q "^FAIL" out/CHK.TXT

      # And the 32-bit one, which is a different compiler target rather than
      # the same binary twice: int is 32 bits and the screen goes through
      # int386 instead of int86.
      - name: Run the 32-bit self-check under DOS
        run: |
          set -e
          rm -rf run out && mkdir -p run out
          cp dos/SKIDCK32.EXE run/
          cat > dos32.conf <<'EOF'
          [sdl]
          output = surface
          [dosbox]
          memsize = 32
          [autoexec]
          mount c run
          mount l out
          c:
          SKIDCK32 > L:\CHK32.TXT
          exit
          EOF
          SDL_VIDEODRIVER=dummy dosbox -conf dos32.conf -exit || true
          echo "--- what the 32-bit build says about itself ---"
          cat out/CHK32.TXT
          grep -q "self-check passed" out/CHK32.TXT
          ! grep -q "^FAIL" out/CHK32.TXT

  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dos, path: bin }

      # SKIDCFG_VERSION is the only place a version is written, so a tag that
      # disagrees with it would ship a binary printing the other number. Catch
      # that here rather than in a bug report.
      - name: Version
        id: v
        run: |
          set -e
          # tr first. .gitattributes checks every .h out CRLF for Turbo C, so
          # the line ends 0D 0A and the substitution above leaves the 0D
          # outside the capture and in the value. The version then compares
          # unequal to its own tag and every name built from it carries a
          # carriage return.
          VER=$(tr -d '\r' < src/version.h \
                | sed -n 's/^#define SKIDCFG_VERSION "\(.*\)"/\1/p')
          [ -n "$VER" ] || { echo "no SKIDCFG_VERSION in src/version.h"; exit 1; }
          case $VER in
            *[!0-9.]*) echo "SKIDCFG_VERSION '$VER' is not digits and dots"
                       exit 1;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG=${GITHUB_REF_NAME#v}
            [ "$TAG" = "$VER" ] || {
              echo "tag v$TAG disagrees with SKIDCFG_VERSION $VER in src/version.h"
              exit 1; }
          fi
          # SKIDCF10.ZIP, from 1.0. DOS wants 8.3, and a version long enough to
          # break it should say so here rather than ship an unopenable name.
          DOSZIP="SKIDCF$(echo "$VER" | tr -d .)"
          [ ${#DOSZIP} -le 8 ] || { echo "$DOSZIP exceeds 8.3"; exit 1; }
          echo "ver=$VER"           >> "$GITHUB_OUTPUT"
          echo "doszip=$DOSZIP.ZIP" >> "$GITHUB_OUTPUT"
          echo "winzip=skidcfg-$VER-win32.zip" >> "$GITHUB_OUTPUT"

      # Generated from README.md at the tagged commit, so the text a release
      # ships cannot lag the text it documents.
      - name: Generate README.TXT
        run: |
          set -e
          make README.TXT
          # EDIT.COM reads 78 columns. Assert it, because the failure is silent:
          # a long line wraps and the file merely looks bad on the machine that
          # nobody building the release is using.
          if sed 's/\r$//' README.TXT | awk 'length>78{exit 1}'; then
            echo "README.TXT fits 78 columns: OK"
          else
            echo "README.TXT has lines past 78 columns:" >&2
            sed 's/\r$//' README.TXT | awk 'length>78{printf "  %d (%d): %s\n", NR, length, $0}' >&2
            exit 1
          fi
          file README.TXT

      # A licence is not optional: MIT asks that the notice travel with every
      # copy, and a binary is a copy.
      #
      # SKIDCHK.EXE deliberately does not travel, though it is built and run
      # above. It is a developer's test rather than a user's tool: it reports a
      # count of checks that means nothing to somebody who wants a setup
      # screen, and it is the one binary here that writes and removes files
      # named after the game's own. It refuses to run anywhere those files
      # already exist, so shipping it would be safe, but an archive people
      # unpack into a Stunts directory is not where it belongs.
      #
      # DRVBLOCK.md does not travel either. Its tables do not survive being
      # flattened to 78 columns, and the reader who wants it is writing a
      # driver, which means a compiler and a browser and no trouble finding the
      # repository. The README in here says where it is.
      # LICENSE.TXT rather than LICENSE, and generated rather than copied. The
      # repository's file is UTF-8 with LF, which a DOS reader gets as one
      # run-on line with two wrong glyphs in the author's name. The Makefile
      # rule converts it and asserts the result, so a letter it cannot map
      # stops the release instead of shipping the mojibake.
      - name: Assemble
        run: |
          set -e
          make LICENSE.TXT DOS32A.TXT
          mkdir -p stage
          cp LICENSE.TXT README.TXT DOS32A.TXT stage/
          cp bin/SKIDCFG.EXE bin/SKIDCF32.EXE stage/
          chmod +x stage/SKIDCFG.EXE stage/SKIDCF32.EXE
          # -0 stores rather than deflates, and that is deliberate. Deflate
          # arrived with PKZIP 2.04g in 1993; PKUNZIP 1.1, which is what a
          # machine of the game's own vintage has, cannot read a deflated
          # member at all. The whole archive is a few tens of kilobytes either
          # way, so the compression buys nothing worth an extractor the reader
          # may not have. -X keeps the extra fields out.
          (cd stage && zip -X -0 "../${{ steps.v.outputs.doszip }}" \
                           LICENSE.TXT README.TXT DOS32A.TXT \
                           SKIDCFG.EXE SKIDCF32.EXE)

          # The Windows archive. No 8.3 name and no stored-only rule: the
          # reader has a modern extractor, and the DOS/32A notice does not
          # travel because nothing in here links the extender.
          mkdir -p win32
          cp LICENSE.TXT README.TXT bin/SKIDCFW.EXE win32/
          (cd win32 && zip -X -9 "../${{ steps.v.outputs.winzip }}" \
                           LICENSE.TXT README.TXT SKIDCFW.EXE)

          sha256sum "${{ steps.v.outputs.doszip }}" \
                    "${{ steps.v.outputs.winzip }}" > SHA256SUMS

      # Verification comes free twice over: SHA256SUMS for a modern machine, and
      # the CRC-32 the ZIP format already stores per member, which is the same
      # one PKZIP shipped in 1989. unzip -t checks the latter, so a reader on DOS
      # with PKUNZIP -T is checking what was checked here.
      - name: Verify
        run: |
          set -e
          sha256sum -c SHA256SUMS
          unzip -t "${{ steps.v.outputs.doszip }}"
          unzip -l "${{ steps.v.outputs.doszip }}"
          unzip -t "${{ steps.v.outputs.winzip }}"
          unzip -l "${{ steps.v.outputs.winzip }}"
          cat SHA256SUMS

          # Everything SHA256SUMS names has to be something a reader can
          # actually fetch. A checksum file listing an archive the release page
          # does not carry is worse than not listing it, because it reads as
          # proof the file is there. This is the list the publish step attaches;
          # the two are kept honest against each other rather than by eye.
          PUBLISH="${{ steps.v.outputs.doszip }} ${{ steps.v.outputs.winzip }}"
          while read -r _ name; do
            case " $PUBLISH SHA256SUMS " in
              *" $name "*) ;;
              *) echo "SHA256SUMS names $name, which is not published"
                 exit 1;;
            esac
          done < SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.v.outputs.ver }}
          path: |
            ${{ steps.v.outputs.doszip }}
            ${{ steps.v.outputs.winzip }}
            SHA256SUMS
          if-no-files-found: error

      # Only on a tag. A manual run does everything above and stops, which is
      # what makes it useful as a rehearsal.
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "skidcfg ${{ steps.v.outputs.ver }}" \
            --notes-file .github/RELEASE_NOTES.md \
            "${{ steps.v.outputs.doszip }}" \
            "${{ steps.v.outputs.winzip }}" \
            SHA256SUMS
